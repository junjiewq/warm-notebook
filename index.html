<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#E8A87C" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>暖色手账 · Warm Journal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app.css?v=20260805b" />
</head>
<body>
  <div class="paper-bg" aria-hidden="true"></div>

  <header class="hero">
    <p class="eyebrow">Daily · Soft Paper</p>
    <h1 class="brand">暖色手账</h1>
    <p class="tagline">按日期写，按主题串——多条学习线，轻轻收在一页纸上</p>
  </header>

  <main class="desk">
    <nav class="mode-tabs" role="tablist" aria-label="视图切换">
      <button type="button" class="mode-tab is-active" role="tab" aria-selected="true" data-mode="calendar" id="tabCalendar">日历</button>
      <button type="button" class="mode-tab" role="tab" aria-selected="false" data-mode="topics" id="tabTopics">学习线</button>
    </nav>

    <div class="desk-grid" id="deskGrid">
      <!-- Calendar axis -->
      <section class="journal panel" id="panelCalendar" aria-label="月历手账" data-panel="calendar">
        <div class="cal-toolbar">
          <button type="button" class="nav-btn" id="prevMonth" aria-label="上一月">‹</button>
          <h2 class="month-label" id="monthLabel"></h2>
          <button type="button" class="nav-btn" id="nextMonth" aria-label="下一月">›</button>
        </div>
        <button type="button" class="today-chip" id="goToday">回到今天</button>
        <div class="weekday-row" id="weekdayRow"></div>
        <div class="day-grid" id="dayGrid" role="grid" aria-label="日期"></div>
        <p class="hint">点选日期，展开当日手账；可挂上多条学习线</p>
      </section>

      <!-- Topics axis -->
      <section class="journal panel" id="panelTopics" aria-label="学习线" data-panel="topics" hidden>
        <div class="topics-head">
          <h2 class="panel-title">学习线</h2>
          <button type="button" class="text-btn" id="addTopicBtn">＋ 新建主题</button>
        </div>
        <p class="hint topics-hint">主题自建，不限科目。点进一条学习线，按时间看全部笔记。</p>
        <ul class="topic-list" id="topicList"></ul>
        <p class="empty-hint" id="topicsEmpty" hidden>还没有主题。点上方「新建主题」开始一条学习线。</p>
      </section>

      <!-- Topic detail (chronological notes) -->
      <section class="journal panel" id="panelTopicDetail" aria-label="主题笔记" data-panel="topic-detail" hidden>
        <div class="topics-head">
          <button type="button" class="text-btn" id="backToTopics">← 全部学习线</button>
          <div class="topic-detail-actions">
            <button type="button" class="text-btn" id="renameTopicBtn" title="重命名">重命名</button>
            <button type="button" class="text-btn danger" id="deleteTopicBtn" title="删除主题">删除</button>
          </div>
        </div>
        <h2 class="panel-title topic-detail-name" id="topicDetailName"></h2>
        <p class="hint" id="topicDetailMeta"></p>
        <div class="topic-export-row">
          <span class="export-label">导出本主题</span>
          <div class="export-actions">
            <button type="button" class="exp-btn" data-topic-export="md">MD</button>
            <button type="button" class="exp-btn" data-topic-export="json">JSON</button>
            <button type="button" class="exp-btn" data-topic-export="pdf">PDF</button>
            <button type="button" class="exp-btn" data-topic-export="docx">DOCX</button>
            <button type="button" class="exp-btn" data-topic-export="image">图</button>
          </div>
        </div>
        <ul class="topic-notes" id="topicNotes"></ul>
        <p class="empty-hint" id="topicNotesEmpty" hidden>这条学习线还没有笔记。在日历里写日记时，点选主题标签即可挂上。</p>
      </section>
    </div>

    <aside class="export-bar" aria-label="导出" id="mainExportBar">
      <span class="export-label">导出</span>
      <div class="export-actions">
        <button type="button" class="exp-btn" data-export="md" title="导出当日 Markdown">当日 MD</button>
        <button type="button" class="exp-btn" data-export="json" title="导出当日 JSON">当日 JSON</button>
        <button type="button" class="exp-btn" data-export="pdf" title="导出当日 PDF">当日 PDF</button>
        <button type="button" class="exp-btn" data-export="docx" title="导出当日 Word">当日 DOCX</button>
        <button type="button" class="exp-btn" data-export="image" title="导出当日图片">当日图</button>
        <button type="button" class="exp-btn accent" data-export="all" title="导出全部（按日期）">全部·按日</button>
        <button type="button" class="exp-btn accent soft" data-export="by-topic" title="按主题导出">按主题</button>
      </div>
    </aside>
  </main>

  <!-- Editor sheet -->
  <div class="overlay" id="overlay" hidden></div>
  <aside class="sheet" id="editorSheet" role="dialog" aria-modal="true" aria-labelledby="sheetDate" hidden>
    <div class="sheet-handle" aria-hidden="true"></div>
    <header class="sheet-head">
      <div>
        <p class="sheet-kicker" id="sheetWeekday"></p>
        <h2 class="sheet-date" id="sheetDate"></h2>
      </div>
      <button type="button" class="icon-btn" id="closeSheet" aria-label="关闭">✕</button>
    </header>
    <div class="sheet-body">
      <div class="sheet-meta">
        <label class="field">
          <span class="field-label">标题（可选）</span>
          <input type="text" id="noteTitle" placeholder="给这一天起个名字…" maxlength="120" autocomplete="off" />
        </label>

        <div class="field">
          <div class="field-label-row">
            <span class="field-label">学习线（可多选）</span>
            <button type="button" class="text-btn tiny" id="sheetAddTopic">＋ 新主题</button>
          </div>
          <div class="topic-chips" id="topicChips" role="group" aria-label="选择主题"></div>
        </div>

        <details class="template-hint">
          <summary>可选模板提示</summary>
          <p class="template-lines">目标 · 学到了 · 主题 · 疑问</p>
          <button type="button" class="text-btn tiny" id="insertTemplate">插入到正文</button>
        </details>
      </div>

      <div class="editor-wrap">
        <textarea id="noteBody"></textarea>
      </div>
    </div>
    <footer class="sheet-foot">
      <span class="save-status" id="saveStatus">已就绪</span>
      <div class="sheet-actions">
        <div class="mini-export">
          <button type="button" class="ghost-btn" data-day-export="md">MD</button>
          <button type="button" class="ghost-btn" data-day-export="pdf">PDF</button>
          <button type="button" class="ghost-btn" data-day-export="image">图</button>
          <button type="button" class="ghost-btn" data-day-export="docx">DOCX</button>
        </div>
        <button type="button" class="primary-btn" id="saveNote">保存</button>
      </div>
    </footer>
  </aside>

  <div id="exportCard" class="export-card" aria-hidden="true"></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/tinymce@7.6.1/tinymce.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/turndown@7.2.0/dist/turndown.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
  <script src="https://unpkg.com/html-docx-js@0.3.1/dist/html-docx.js"></script>
  <script src="app.js?v=20260805b"></script>
</body>
</html>
