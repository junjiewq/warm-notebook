<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#E8A87C" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>暖色手账 · Warm Journal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde@2.18.0/dist/easymde.min.css" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div class="paper-bg" aria-hidden="true"></div>

  <header class="hero">
    <p class="eyebrow">Daily · Soft Paper</p>
    <h1 class="brand">暖色手账</h1>
    <p class="tagline">把今天的光，轻轻记在一页纸上</p>
  </header>

  <main class="desk">
    <section class="journal" aria-label="月历手账">
      <div class="cal-toolbar">
        <button type="button" class="nav-btn" id="prevMonth" aria-label="上一月">‹</button>
        <h2 class="month-label" id="monthLabel"></h2>
        <button type="button" class="nav-btn" id="nextMonth" aria-label="下一月">›</button>
      </div>
      <button type="button" class="today-chip" id="goToday">回到今天</button>
      <div class="weekday-row" id="weekdayRow"></div>
      <div class="day-grid" id="dayGrid" role="grid" aria-label="日期"></div>
      <p class="hint">点选日期，展开当日手账</p>
    </section>

    <aside class="export-bar" aria-label="导出">
      <span class="export-label">导出</span>
      <div class="export-actions">
        <button type="button" class="exp-btn" data-export="md" title="Markdown">MD</button>
        <button type="button" class="exp-btn" data-export="json" title="JSON">JSON</button>
        <button type="button" class="exp-btn" data-export="pdf" title="PDF">PDF</button>
        <button type="button" class="exp-btn" data-export="docx" title="Word">DOCX</button>
        <button type="button" class="exp-btn" data-export="image" title="图片">图</button>
        <button type="button" class="exp-btn accent" data-export="all-json" title="全部 JSON">全部</button>
      </div>
    </aside>
  </main>

  <!-- Editor sheet -->
  <div class="overlay" id="overlay" hidden></div>
  <aside class="sheet" id="editorSheet" role="dialog" aria-modal="true" aria-labelledby="sheetDate" hidden>
    <div class="sheet-handle" aria-hidden="true"></div>
    <header class="sheet-head">
      <div>
        <p class="sheet-kicker" id="sheetWeekday"></p>
        <h2 class="sheet-date" id="sheetDate"></h2>
      </div>
      <button type="button" class="icon-btn" id="closeSheet" aria-label="关闭">✕</button>
    </header>
    <div class="sheet-body">
      <label class="field">
        <span class="field-label">标题（可选）</span>
        <input type="text" id="noteTitle" placeholder="给这一天起个名字…" maxlength="120" autocomplete="off" />
      </label>
      <div class="editor-wrap">
        <textarea id="noteBody"></textarea>
      </div>
    </div>
    <footer class="sheet-foot">
      <span class="save-status" id="saveStatus">已就绪</span>
      <div class="sheet-actions">
        <div class="mini-export">
          <button type="button" class="ghost-btn" data-day-export="md">MD</button>
          <button type="button" class="ghost-btn" data-day-export="pdf">PDF</button>
          <button type="button" class="ghost-btn" data-day-export="image">图</button>
          <button type="button" class="ghost-btn" data-day-export="docx">DOCX</button>
        </div>
        <button type="button" class="primary-btn" id="saveNote">保存</button>
      </div>
    </footer>
  </aside>

  <!-- Hidden render target for exports -->
  <div id="exportCard" class="export-card" aria-hidden="true"></div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/easymde@2.18.0/dist/easymde.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
  <script src="https://unpkg.com/html-docx-js@0.3.1/dist/html-docx.js"></script>
  <script src="app.js"></script>
</body>
</html>
